<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <link rel="icon" type="image/ico" sizes="32x32" href="../images/favicon.ico">
  <link rel="stylesheet" href="../css/app.css?v=0.2.5">
  <link rel="stylesheet" href="../css/lumos.css?v=1.5">
  <title>許願池 | Lumos</title>
</head>
<body class="loaded">
  <main>
    <div class="inner single-column">
      <div id="main">
        <article class="post block archive-page wish-page" data-view="wish">
          <header class="post-hero" style="--post-cover:url('../images/covers/cover-literature.jpg')">
            <div>
              <h1 class="title">許願池</h1>
              <div class="meta"><span class="item"><i class="ic i-feather"></i> 自由指定創作形式與題目</span></div>
            </div>
          </header>
          <div class="wish-intro">
            <p>把你想指定的創作題目丟進來，我會私下收到。許願內容不會顯示在前台。</p>
            <span class="community-mode">讀取中</span>
          </div>
          <form class="wish-form community-form">
            <label>
              願望內容
              <textarea name="prompt" rows="7" maxlength="1400" placeholder="想指定的形式、題目、人物、情境、語氣、字數或限制都可以寫在這裡。"></textarea>
            </label>
            <div class="form-grid">
              <label>
                補充
                <input name="note" maxlength="180" placeholder="例如：想要溫柔一點、搞笑一點、古風一點">
              </label>
              <label>
                聯絡方式，可不填
                <input name="contact" maxlength="120" placeholder="如果希望我回覆，可以留暱稱或聯絡方式">
              </label>
            </div>
            <button type="submit">送出許願</button>
            <p class="community-hint"></p>
          </form>
          <nav class="post-actions"><a class="btn" href="../">回首頁</a><a class="btn ghost" href="../archives/">看文章</a></nav>
        </article>
      </div>
    </div>
  </main>
  <script src="../js/site.js?v=1.5"></script>
</body>
</html>
